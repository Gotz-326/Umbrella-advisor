name: Wake Render App

on:
  schedule:
    - cron: '20,50 * * * *'   
  workflow_dispatch: 

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Retry until app wakes up
        run: |
          curl --retry 8 --retry-delay 10 --retry-all-errors \
            -f https://umbrella-advisor.onrender.com/health